rules:
  # === Critical Severity Rules ===

  # Code injection via reflection
  - id: java-reflection-injection
    message: "Code injection via reflection detected. User-controlled data flows into dynamic class loading or script evaluation, letting an attacker load arbitrary classes or run arbitrary code. Resolve the value through a fixed allowlist instead of passing request data to Class.forName or a script engine."
    severity: CRITICAL
    languages: [java]
    mode: taint
    pattern-sources:
      # Servlet request sources
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getPathInfo()
      - pattern: $REQ.getRequestURI()
      # Type constrained: an untyped $REQ.getInputStream() also matched
      # Resource.getInputStream(), which is a classpath resource, not input.
      - pattern: (HttpServletRequest $R).getInputStream()
      - pattern: (HttpServletRequest $R).getReader()
      - pattern: (javax.servlet.http.HttpServletRequest $R).getInputStream()
      - pattern: (javax.servlet.http.HttpServletRequest $R).getReader()
      - pattern: (Cookie $C).getValue()
      # Spring MVC parameter binding
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) { ... }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @PathVariable(...) $TYPE $PARAM, ...) { ... }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestBody $TYPE $PARAM, ...) { ... }
    pattern-propagators:
      - pattern: (String $A) + (String $B)
        from: $B
        to: $A
      - pattern: (String $A).concat($B)
        from: $B
        to: $A
      - pattern: String.format($FMT, ..., $X, ...)
        from: $X
        to: String.format
      - pattern: $B.append($X)
        from: $X
        to: $B
    pattern-sinks:
      # Dynamic class loading
      - pattern: Class.forName(...)
      - pattern: java.lang.Class.forName(...)
      - pattern: $LOADER.loadClass(...)
      # Script and expression evaluation
      - pattern: (ScriptEngine $E).eval(...)
      - pattern: (GroovyShell $S).evaluate(...)
      - pattern: (GroovyShell $S).parse(...)
      - pattern: (ExpressionParser $P).parseExpression(...)
    pattern-sanitizers:
      # Resolving the value through an allowlist removes attacker control
      - pattern: $MAP.get(...)
      - pattern: $ENUM.valueOf(...)
    metadata:
      category: security
      cwe: CWE-470
      confidence: high
      subcategory: injection
      vulnerability_class: "Injection Vulnerability"
      owasp: "A03:2021"
      fix: "Map the user-supplied value to a class or handler through an explicit allowlist (for example a Map<String, Class<?>>) rather than passing it to Class.forName(). Never pass request data to ScriptEngine.eval()."

  # SQL injection - using taint mode for accurate detection
  - id: java-sql-injection
    message: "SQL injection vulnerability detected. User-controlled data flows into SQL execution without proper sanitization. Use PreparedStatement with parameter binding to prevent SQL injection."
    severity: CRITICAL
    languages: [java]
    mode: taint
    pattern-sources:
      # Servlet request sources
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getRequestURI()
      - pattern: $REQ.getCookies()
      - pattern: $REQ.getInputStream()
      - pattern: $REQ.getReader()
      # User object getters that typically return user input
      - pattern: $OBJ.getUsername()
      - pattern: $OBJ.getName()
      - pattern: $OBJ.getEmail()
      - pattern: $OBJ.getPassword()
      - pattern: $OBJ.getValue()
      - pattern: $OBJ.getData()
      - pattern: $OBJ.getInput()
      - pattern: $OBJ.getContent()
      - pattern: $OBJ.getText()
    pattern-propagators:
      # StringBuilder/StringBuffer propagation
      - pattern: $B.append(...)
        from: $B
        to: $B
      - pattern: $B.append($X)
        from: $X
        to: $B
      - pattern: (StringBuilder $B).toString()
        from: $B
        to: (StringBuilder $B).toString()
      - pattern: (StringBuffer $B).toString()
        from: $B
        to: (StringBuffer $B).toString()
      # String.format propagation
      - pattern: String.format($FMT, ..., $X, ...)
        from: $X
        to: String.format
      # String concatenation
      - pattern: (String $A) + (String $B)
        from: $B
        to: $A
      - pattern: (String $A).concat($B)
        from: $B
        to: $A
    pattern-sinks:
      # JDBC statement execution
      - pattern: $STMT.executeQuery(...)
      - pattern: $STMT.execute(...)
      - pattern: $STMT.executeUpdate(...)
      - pattern: $STMT.executeLargeUpdate(...)
      # JPA/Hibernate query creation
      - pattern: $EM.createQuery(...)
      - pattern: $EM.createNativeQuery(...)
      - pattern: $SESSION.createQuery(...)
      - pattern: $SESSION.createSQLQuery(...)
      # JDBC template methods
      - pattern: $TEMPLATE.query(...)
      - pattern: $TEMPLATE.queryForObject(...)
      - pattern: $TEMPLATE.queryForList(...)
      - pattern: $TEMPLATE.execute(...)
      - pattern: $TEMPLATE.update(...)
    pattern-sanitizers:
      # PreparedStatement parameter binding
      - pattern: $STMT.setString(...)
        by-side-effect: true
      - pattern: $STMT.setInt(...)
        by-side-effect: true
      - pattern: $STMT.setObject(...)
        by-side-effect: true
      # JPA parameter binding
      - pattern: $QUERY.setParameter(...)
        by-side-effect: true
      # Spring named parameter binding
      - pattern: $SOURCE.addValue(...)
        by-side-effect: true
    metadata:
      category: security
      cwe: CWE-89
      owasp:
        - A03:2021 - Injection
      confidence: high
      subcategory: injection
      vulnerability_class: "Injection Vulnerability"
      fix: "Use PreparedStatement with parameter binding: ps = conn.prepareStatement('SELECT * FROM t WHERE id = ?'); ps.setString(1, userId);"

  # Deserialization vulnerabilities
  - id: java-unsafe-deserialization
    message: "Unsafe deserialization detected. Java native deserialization of attacker-controlled bytes leads to remote code execution through gadget chains. Use a data-only format such as JSON or Protocol Buffers, or install an ObjectInputFilter (JEP 290) that allowlists deserializable classes."
    severity: CRITICAL
    languages: [java]
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    patterns:
      - pattern-either:
          # Receiver must actually be an ObjectInputStream. A bare $X.readObject()
          # also matches unrelated APIs such as BouncyCastle's PEMParser and
          # JBoss Marshalling's Unmarshaller, which are not Java deserialization.
          - pattern: (ObjectInputStream $OIS).readObject()
          - pattern: new ObjectInputStream(...).readObject()
          - pattern: (XMLDecoder $D).readObject()
          - pattern: new XMLDecoder(...).readObject()
          # SnakeYAML without a SafeConstructor deserializes arbitrary types
          - pattern: new Yaml().load(...)
          - pattern: (Yaml $Y).load(...)
      # Implementing the java.io.Serializable contract requires calling
      # readObject() on the stream the JVM hands you. That is not a finding.
      - pattern-not-inside: |
          private void readObject($T $S) { ... }
      - pattern-not-inside: |
          private void readObject($T $S) throws $EX { ... }
      - pattern-not-inside: |
          public void readExternal($T $S) { ... }
      - pattern-not-inside: |
          public void readExternal($T $S) throws $EX { ... }
    metadata:
      category: security
      cwe: CWE-502
      confidence: high
      subcategory: integrity
      vulnerability_class: "Insecure Deserialization"
      owasp: "A08:2021"
      fix: "Use ObjectInputFilter (JEP 290) to restrict deserializable classes. Prefer JSON (Jackson/Gson) or Protocol Buffers for data interchange. For SnakeYAML use new Yaml(new SafeConstructor())."

  # Command injection - using taint mode for accurate detection
  - id: java-command-injection
    message: "Command injection vulnerability detected. User-controlled data flows into system command execution without proper validation. Avoid command execution with user input; if necessary, use strict allowlisting."
    severity: CRITICAL
    languages: [java]
    mode: taint
    pattern-sources:
      # Servlet request sources
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getRequestURI()
      # User object getters
      - pattern: $OBJ.getCommand()
      - pattern: $OBJ.getFilename()
      - pattern: $OBJ.getName()
      - pattern: $OBJ.getValue()
      - pattern: $OBJ.getData()
      - pattern: $OBJ.getInput()
    pattern-propagators:
      # String concatenation
      - pattern: (String $A) + (String $B)
        from: $B
        to: $A
      - pattern: (String $A).concat($B)
        from: $B
        to: $A
      # StringBuilder/StringBuffer
      - pattern: $B.append($X)
        from: $X
        to: $B
      # String.format
      - pattern: String.format($FMT, ..., $X, ...)
        from: $X
        to: String.format
      # Array creation with tainted elements
      - pattern: new String[] {..., $X, ...}
        from: $X
        to: new String[]
    pattern-sinks:
      # Runtime exec
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: $RUNTIME.exec(...)
      # ProcessBuilder
      - pattern: new ProcessBuilder(...)
      - pattern: $BUILDER.command(...)
      - pattern: ProcessBuilder.start()
      # Legacy Process API
      - pattern: Process.start(...)
    metadata:
      category: security
      cwe: CWE-78
      confidence: high
      subcategory: injection
      vulnerability_class: "Injection Vulnerability"
      owasp: "A03:2021"
      fix: "Use ProcessBuilder with separate arguments: new ProcessBuilder('cmd', arg1, arg2). Never concatenate user input into Runtime.exec() strings."

  # LDAP injection
  - id: java-ldap-injection
    message: "LDAP injection vulnerability detected. User-controlled data is concatenated into an LDAP search filter or distinguished name, letting an attacker rewrite the query and retrieve or modify directory entries they should not reach. Escape the value or bind it as a filter argument."
    severity: CRITICAL
    languages: [java]
    mode: taint
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getPathInfo()
      - pattern: $REQ.getRequestURI()
      # Type constrained: an untyped $REQ.getInputStream() also matched
      # Resource.getInputStream(), which is a classpath resource, not input.
      - pattern: (HttpServletRequest $R).getInputStream()
      - pattern: (HttpServletRequest $R).getReader()
      - pattern: (javax.servlet.http.HttpServletRequest $R).getInputStream()
      - pattern: (javax.servlet.http.HttpServletRequest $R).getReader()
      # Cookie values are attacker controlled and are the source in a large
      # share of real path traversal and injection findings.
      - pattern: (Cookie $C).getValue()
      - pattern: (javax.servlet.http.Cookie $C).getValue()
      # Archive entry names and uploaded filenames are attacker controlled.
      # ZipEntry.getName() is the Zip Slip source; MultipartFile carries the
      # client-supplied filename verbatim.
      - pattern: (ZipEntry $E).getName()
      - pattern: (java.util.zip.ZipEntry $E).getName()
      - pattern: (ArchiveEntry $E).getName()
      - pattern: (MultipartFile $F).getOriginalFilename()
      - pattern: (org.springframework.web.multipart.MultipartFile $F).getOriginalFilename()
      - pattern: (Part $P).getSubmittedFileName()
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) { ... }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @PathVariable(...) $TYPE $PARAM, ...) { ... }
    pattern-propagators:
      - pattern: (String $A) + (String $B)
        from: $B
        to: $A
      - pattern: (String $A).concat($B)
        from: $B
        to: $A
      - pattern: String.format($FMT, ..., $X, ...)
        from: $X
        to: String.format
      - pattern: $B.append($X)
        from: $X
        to: $B
      - pattern: (StringBuilder $B).toString()
        from: $B
        to: (StringBuilder $B).toString()
      # URL decoding is not sanitisation; it preserves attacker control and is
      # applied to almost every header-sourced value in real servlet code.
      - pattern: URLDecoder.decode($X, ...)
        from: $X
        to: URLDecoder.decode
      - pattern: java.net.URLDecoder.decode($X, ...)
        from: $X
        to: java.net.URLDecoder.decode
      - pattern: new String($X)
        from: $X
        to: new String
      - pattern: new String($X, ...)
        from: $X
        to: new String
      - pattern: (String $S).substring(...)
        from: $S
        to: (String $S).substring(...)
      - pattern: (String $S).trim()
        from: $S
        to: (String $S).trim()
      - pattern: (String $S).toLowerCase(...)
        from: $S
        to: (String $S).toLowerCase(...)
      - pattern: (String $S).replace(...)
        from: $S
        to: (String $S).replace(...)
      - pattern: (String $S).getBytes(...)
        from: $S
        to: (String $S).getBytes(...)
      - pattern: $E.nextElement()
        from: $E
        to: $E.nextElement()
      - pattern: Base64.decodeBase64($X)
        from: $X
        to: Base64.decodeBase64
      - pattern: org.apache.commons.codec.binary.Base64.decodeBase64($X)
        from: $X
        to: org.apache.commons.codec.binary.Base64.decodeBase64
      - pattern: Base64.encodeBase64($X)
        from: $X
        to: Base64.encodeBase64
      - pattern: org.apache.commons.codec.binary.Base64.encodeBase64($X)
        from: $X
        to: org.apache.commons.codec.binary.Base64.encodeBase64
    pattern-sinks:
      - pattern: (DirContext $CTX).search(...)
      - pattern: (InitialDirContext $CTX).search(...)
      - pattern: (javax.naming.directory.DirContext $CTX).search(...)
      - pattern: $CTX.search($BASE, $FILTER, ...)
      - pattern: new SearchFilter(...)
      - pattern: new LdapName(...)
      - pattern: new javax.naming.ldap.LdapName(...)
      - pattern: (LdapTemplate $T).search(...)
      - pattern: (LdapQueryBuilder $Q).filter(...)
    pattern-sanitizers:
      - pattern: LdapEncoder.filterEncode(...)
      - pattern: org.springframework.ldap.support.LdapEncoder.filterEncode(...)
      - pattern: LdapEncoder.nameEncode(...)
      - pattern: ESAPI.encoder().encodeForLDAP(...)
      - pattern: $ENC.encodeForLDAP(...)
      - pattern: $ENC.encodeForDN(...)
      - pattern: Integer.parseInt(...)
    metadata:
      category: security
      cwe: CWE-90
      confidence: high
      subcategory: injection
      vulnerability_class: "Injection Vulnerability"
      owasp: "A03:2021"
      fix: "Escape the value with LdapEncoder.filterEncode() from Spring LDAP, or pass it as a bound filter argument via search(base, '(uid={0})', new Object[]{ value }, controls)."

  # Hardcoded credentials
  - id: java-hardcoded-credentials
    message: "Hard-coded credentials detected. Embedding secrets in source code makes them easily discoverable and impossible to rotate. Use environment variables or a secrets manager instead."
    severity: HIGH
    languages: [java]
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    pattern-either:
      # Pattern 1: name suggests a credential AND the value looks like a real secret
      - patterns:
          - pattern-either:
              - pattern: private static final String $VAR = "$VALUE";
              - pattern: public static final String $VAR = "$VALUE";
              - pattern: static final String $VAR = "$VALUE";
              - pattern: private String $VAR = "$VALUE";
              - pattern: String $VAR = "$VALUE";
          - metavariable-regex:
              metavariable: $VAR
              # A bare "key" matches constants such as KEY_ATTRIBUTE, PARENT_KEY
              # and SEC_WEBSOCKET_KEY1, which are map keys and header names, not
              # secrets, so "key" is only honoured in compound credential words.
              # "token", "password" and "secret" are specific enough to stand alone.
              regex: (?i).*(password|passwd|pwd|secret|credential|token|api_?key|apikey|secret_?key|private_?key|access_?key|encryption_?key|signing_?key|connection_?string).*
          - metavariable-regex:
              metavariable: $VALUE
              # Non-empty. Default credentials such as "admin" are short and are
              # exactly the finding that matters, so the floor stays low and the
              # shape exclusions below carry the precision.
              regex: ^.{4,}$
          - metavariable-regex:
              metavariable: $VALUE
              # Exclude identifiers, header names, property paths, format strings
              # and placeholder expressions, which are configuration, not secrets.
              regex: ^(?!.*[ :;,{}<>()\[\]])(?!.*\$\{)(?!.*%[sdf])(?!(?i)(none|null|true|false|unset|example|placeholder|changeit)$).*$
          - metavariable-regex:
              metavariable: $VALUE
              # A dotted identifier is a system property or a class name
              # (java.net.socks.password, sun.misc.SharedSecrets), not a secret.
              regex: ^(?!^[A-Za-z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+$).*$
          - metavariable-regex:
              metavariable: $VALUE
              # A hyphenated name containing lowercase is an HTTP header name
              # (Access-Control-Allow-Credentials, Sec-Token-Binding). An
              # all-caps hyphenated value such as STAGING-TOKEN-42 is still
              # reported, because that shape really is a secret.
              regex: ^(?!^(?=.*[a-z])[A-Za-z][A-Za-z0-9]*(-[A-Za-z0-9]+)+$).*$
          - metavariable-regex:
              metavariable: $VALUE
              # A lowercase value that just restates the credential keyword is
              # naming a field or an auth method ("password", "accesskey",
              # "stompCredentials"), not holding one. Real default credentials
              # such as "admin" or "webgoat" do not restate the keyword.
              regex: ^(?!(?=[a-z])(?i:[a-z0-9]*(password|passwd|credential|secret|token|apikey|accesskey|auth)[a-z0-9]*)$).*$
      # Pattern 2: credential APIs called with string literals
      - pattern: new PasswordAuthentication($USER, "...".toCharArray())
      - pattern: DriverManager.getConnection($URL, $USER, "...")
      - pattern: java.sql.DriverManager.getConnection($URL, $USER, "...")
      - pattern: new BasicAWSCredentials("...", "...")
      - pattern: $CTX.addToEnvironment(Context.SECURITY_CREDENTIALS, "...")
    metadata:
      category: security
      cwe: CWE-798
      confidence: medium
      subcategory: authentication
      vulnerability_class: "Authentication Weakness"
      owasp: "A07:2021"
      fix: "Store secrets in environment variables (System.getenv('KEY')), a secrets manager, or externalized configuration (Spring Vault, AWS Secrets Manager)."

  # Weak cryptography
  - id: java-weak-crypto-md5
    message: "Weak hash algorithm (MD5) detected. MD5 is collision-broken and must not be used for signatures, integrity checks, or password storage. Use SHA-256 or better, and a password hash such as bcrypt, scrypt or Argon2 for credentials."
    severity: HIGH
    languages: [java]
    pattern-either:
      - patterns:
          - pattern-either:
              # Covers the one-, two- and three-argument getInstance overloads,
              # both imported and fully qualified. Real code frequently writes
              # java.security.MessageDigest.getInstance("MD5", "SUN").
              - pattern: MessageDigest.getInstance("$ALGO", ...)
              - pattern: java.security.MessageDigest.getInstance("$ALGO", ...)
          - metavariable-regex:
              metavariable: $ALGO
              regex: (?i)^(md5|md-5|md2|md4)$
      - pattern: DigestUtils.md5($DATA)
      - pattern: DigestUtils.md5Hex($DATA)
      - pattern: org.apache.commons.codec.digest.DigestUtils.md5($DATA)
      - pattern: org.apache.commons.codec.digest.DigestUtils.md5Hex($DATA)
    metadata:
      category: security
      cwe: CWE-327
      confidence: high
      subcategory: crypto
      vulnerability_class: "Cryptographic Weakness"
      owasp: "A02:2021"
      fix: "Use MessageDigest.getInstance('SHA-256'). For password storage use BCrypt, SCrypt or Argon2 rather than a raw digest."

  - id: java-weak-crypto-sha1
    message: "Weak hash algorithm (SHA-1) detected. SHA-1 is collision-broken and must not be used for signatures or integrity checks. Use SHA-256 or better."
    severity: HIGH
    languages: [java]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: MessageDigest.getInstance("$ALGO", ...)
              - pattern: java.security.MessageDigest.getInstance("$ALGO", ...)
          - metavariable-regex:
              metavariable: $ALGO
              regex: (?i)^(sha1|sha-1)$
      - pattern: DigestUtils.sha1($DATA)
      - pattern: DigestUtils.sha1Hex($DATA)
      - pattern: org.apache.commons.codec.digest.DigestUtils.sha1($DATA)
    metadata:
      category: security
      cwe: CWE-327
      confidence: high
      subcategory: crypto
      vulnerability_class: "Cryptographic Weakness"
      owasp: "A02:2021"
      fix: "Use MessageDigest.getInstance('SHA-256') or stronger."

  # Insecure random
  - id: java-insecure-random
    message: "Insecure random number generator used for a security value. java.util.Random and Math.random() are linear congruential generators whose output is predictable from a few observed values, so tokens, session identifiers, salts and keys derived from them can be guessed. Use java.security.SecureRandom."
    severity: HIGH
    languages: [java]
    mode: taint
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    pattern-sources:
      # Both the imported and fully qualified spellings; benchmark and real code
      # both write new java.util.Random() in full.
      - pattern: new Random(...).$M(...)
      - pattern: new java.util.Random(...).$M(...)
      - pattern: (Random $R).$M(...)
      - pattern: Math.random()
      - pattern: java.lang.Math.random()
      - pattern: ThreadLocalRandom.current().$M(...)
      - pattern: (RandomStringUtils $U).random(...)
      - pattern: RandomStringUtils.random(...)
      - pattern: RandomStringUtils.randomAlphanumeric(...)
    pattern-propagators:
      - pattern: Float.toString($X)
        from: $X
        to: Float.toString
      - pattern: Double.toString($X)
        from: $X
        to: Double.toString
      - pattern: Long.toString($X, ...)
        from: $X
        to: Long.toString
      - pattern: Integer.toString($X, ...)
        from: $X
        to: Integer.toString
      - pattern: String.valueOf($X)
        from: $X
        to: String.valueOf
      - pattern: (String $S).substring(...)
        from: $S
        to: (String $S).substring(...)
      - pattern: (String $A) + (String $B)
        from: $B
        to: $A
      - pattern: $B.append($X)
        from: $X
        to: $B
      - pattern: $ENC.encodeToString($X)
        from: $X
        to: $ENC.encodeToString($X)
    pattern-sinks:
      # A weak PRNG is only a vulnerability when its output becomes a security
      # value. Shuffling a list, jittering a retry, or seeding a JMH benchmark
      # is not. Require the value to land somewhere security relevant.
      - patterns:
          - pattern: $VAR = $SRC
          - focus-metavariable: $SRC
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i).*(token|session|nonce|salt|secret|password|passwd|credential|apikey|api_key|privatekey|private_key|otp|pin|pincode|csrf|iv|initvector|cookie|auth|verifier|challenge|resetcode|activation|captcha|guid|uuid|seed|key)
      - patterns:
          - pattern: $TYPE $VAR = $SRC;
          - focus-metavariable: $SRC
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i).*(token|session|nonce|salt|secret|password|passwd|credential|apikey|api_key|privatekey|private_key|otp|pin|pincode|csrf|iv|initvector|cookie|auth|verifier|challenge|resetcode|activation|captcha|guid|uuid|key)
      # A weak PRNG inside a class whose whole purpose is a security mechanism
      # is a finding regardless of what the local variable is called. This is
      # what catches session-id and CSRF-token generators that assign to `id`.
      - patterns:
          - pattern-inside: |
              class $CLS { ... }
          - metavariable-regex:
              metavariable: $CLS
              regex: (?i).*(session|csrf|xsrf|token|password|passwd|credential|authentication|crypto|cipher|secret|nonce|otp|pincode|resetlink).*
          - pattern: $VAR = $SRC
          - focus-metavariable: $SRC
      # Direct use in security APIs
      - pattern: new Cookie($NAME, ...)
      - pattern: new javax.servlet.http.Cookie($NAME, ...)
      - pattern: (Cookie $C).setValue(...)
      - pattern: new SecretKeySpec(...)
      - pattern: new javax.crypto.spec.SecretKeySpec(...)
      - pattern: new IvParameterSpec(...)
      - pattern: (MessageDigest $D).update(...)
    metadata:
      category: security
      cwe: CWE-338
      confidence: high
      subcategory: crypto
      vulnerability_class: "Cryptographic Weakness"
      owasp: "A02:2021"
      fix: "Use java.security.SecureRandom for tokens, session identifiers, salts, IVs and keys. SecureRandom.getInstanceStrong() is appropriate for long-lived secrets."

  # XXE vulnerabilities
  - id: java-xxe-vulnerability
    message: "XML External Entity (XXE) vulnerability. The XML parser processes external entity references that can read local files or make network requests. Disable external entity processing in XML parsers."
    severity: HIGH
    languages: [java]
    pattern-either:
      - pattern: DocumentBuilderFactory.newInstance()
      - pattern: SAXParserFactory.newInstance()
      - pattern: XMLInputFactory.newInstance()
      - pattern: SchemaFactory.newInstance(...)
      - pattern: TransformerFactory.newInstance()
    pattern-not-inside:
      pattern: |
        ...
        $FACTORY.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        ...
    metadata:
