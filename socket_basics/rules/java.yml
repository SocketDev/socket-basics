  # Cookie security issues
  - id: java-insecure-cookie
    message: "Cookie created without the Secure flag. The cookie may be transmitted over unencrypted HTTP, allowing interception. Call setSecure(true) and setHttpOnly(true) before adding the cookie to the response."
    severity: MEDIUM
    languages: [java]
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    patterns:
      - pattern-either:
          # Servlet code very often writes the constructor fully qualified.
          - pattern: new Cookie($NAME, $VALUE)
          - pattern: new javax.servlet.http.Cookie($NAME, $VALUE)
          - pattern: new jakarta.servlet.http.Cookie($NAME, $VALUE)
      # The exclusion is bound to the same variable. A scope-wide
      # "any setSecure(true) nearby" check let one hardened cookie exonerate
      # every other cookie in the same method.
      - pattern-not-inside: |
          $T $COOKIE = new Cookie(...);
          ...
          $COOKIE.setSecure(true);
      - pattern-not-inside: |
          $T $COOKIE = new javax.servlet.http.Cookie(...);
          ...
          $COOKIE.setSecure(true);
      - pattern-not-inside: |
          $T $COOKIE = new jakarta.servlet.http.Cookie(...);
          ...
          $COOKIE.setSecure(true);
    metadata:
      category: security
      cwe: CWE-614
      confidence: medium
      subcategory: configuration
      vulnerability_class: "Security Misconfiguration"
      owasp: "A05:2021"
      fix: "Call cookie.setSecure(true) and cookie.setHttpOnly(true), or set server.servlet.session.cookie.secure=true in Spring Boot."

  # System.out usage in production
  - id: java-system-out-usage
    message: "Sensitive information written to console output. Passwords, tokens, or personal data printed to stdout or stderr end up in container logs and CI output where they are broadly readable. Redact the value or remove the statement."
    severity: LOW
    languages: [java]
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
        - "*/example/*"
        - "*/examples/*"
    patterns:
      - pattern-either:
          - pattern: System.out.println($MSG)
          - pattern: System.out.print($MSG)
          - pattern: System.err.println($MSG)
          - pattern: System.err.print($MSG)
      # The rule is about leaking secrets, not about console I/O. Printing a
      # progress message is not a security finding, so require the printed
      # expression to reference something credential bearing.
      - metavariable-regex:
          metavariable: $MSG
          regex: (?i).*(password|passwd|pwd|secret|credential|api_?key|apikey|private_?key|access_?key|auth_?token|access_?token|refresh_?token|session_?id|sessionid|ssn|creditcard|credit_card|cvv|passphrase).*
    metadata:
      category: security
      cwe: CWE-532
      confidence: medium
      subcategory: logging
      vulnerability_class: "Sensitive Data Exposure"
      owasp: "A09:2021"
      fix: "Remove the statement or redact the value before printing. Route diagnostics through a logger with a redaction filter rather than System.out."

  # Empty catch blocks
  - id: java-empty-catch-block
    message: "Broad exception silently swallowed. Catching Exception or Throwable and discarding it without comment or logging hides failures, which can mask a security control that did not run. Log the exception, rethrow it, or document why it is safe to ignore."
    severity: LOW
    languages: [java]
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    patterns:
      - pattern: |
          try {
            ...
          } catch ($EXCEPTION $VAR) {
          }
      # Catching a specific, expected exception and continuing is legitimate
      # control flow. Only a swallowed broad exception is worth reporting.
      - metavariable-regex:
          metavariable: $EXCEPTION
          regex: ^(Exception|Throwable|RuntimeException|java\.lang\.Exception|java\.lang\.Throwable|java\.lang\.RuntimeException)$
      # The conventional Java names for a deliberately discarded exception.
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(?!(ignored|ignore|expected|tolerated|unused|nop|noop|swallowed|discard|discarded)$).*$
      # A catch block carrying an explanatory comment is a reviewed decision,
      # not an oversight. Comments are not AST nodes, so the body still looks
      # empty to the matcher and has to be excluded textually.
      - pattern-not-regex: 'catch\s*\([^)]*\)\s*\{\s*(//|/\*)'
    metadata:
      category: security
      cwe: CWE-703
      confidence: medium
      subcategory: error-handling
      vulnerability_class: "Improper Error Handling"
      fix: "Log the exception with context, rethrow it, rename the variable to 'ignored', or add a comment explaining why discarding it is safe."

  # Hardcoded IP addresses
  - id: java-hardcoded-ip
    message: "Hard-coded private network address detected. Embedding infrastructure addresses in source ties the build to one environment and leaks internal network layout. Move the address to configuration."
    severity: LOW
    languages: [java]
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
        - "*/example/*"
        - "*/examples/*"
    # Requires a full dotted quad. Matching a partial address also matched
    # version strings such as "10.0" and "10.4". Loopback (127.x) and the
    # wildcard bind address are not infrastructure disclosure and are excluded
    # by the leading-octet alternation.
    pattern-regex: '"(?:10|192\.168|172\.(?:1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}(?::[0-9]{1,5})?"'
    metadata:
      category: security
      cwe: CWE-547
      confidence: low
      subcategory: configuration
      vulnerability_class: "Security Misconfiguration"
      fix: "Read the address from configuration (environment variable, application.properties, or service discovery) instead of hard-coding it."

