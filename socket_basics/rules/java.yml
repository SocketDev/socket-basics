      confidence: medium
      subcategory: injection
      vulnerability_class: "Injection Vulnerability"
      owasp: "A05:2021"
      fix: "Set XMLConstants.FEATURE_SECURE_PROCESSING and disable DOCTYPE declarations: factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)."

  # Path traversal - using taint mode for accurate detection
  - id: java-path-traversal
    message: "Path traversal vulnerability detected. User-controlled data flows into a file operation without validation, letting an attacker use ../ sequences to read or write files outside the intended directory. Resolve the path and verify it stays under the intended base directory before opening it."
    severity: HIGH
    languages: [java]
    mode: taint
    paths:
      exclude:
        - "*/src/test/*"
        - "*/src/testFixtures/*"
        - "*/test/java/*"
        - "*/testsuite/*"
        - "*/microbench/*"
        - "*/jmh/*"
        - "*Test.java"
        - "*Tests.java"
        - "*TestCase.java"
        - "*Benchmark.java"
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getPathInfo()
      - pattern: $REQ.getRequestURI()
      # Type constrained: an untyped $REQ.getInputStream() also matched
      # Resource.getInputStream(), which is a classpath resource, not input.
      - pattern: (HttpServletRequest $R).getInputStream()
      - pattern: (HttpServletRequest $R).getReader()
      - pattern: (javax.servlet.http.HttpServletRequest $R).getInputStream()
      - pattern: (javax.servlet.http.HttpServletRequest $R).getReader()
      # Cookie values are attacker controlled and are the source in a large
      # share of real path traversal and injection findings.
      - pattern: (Cookie $C).getValue()
      - pattern: (javax.servlet.http.Cookie $C).getValue()
      # Archive entry names and uploaded filenames are attacker controlled.
      # ZipEntry.getName() is the Zip Slip source; MultipartFile carries the
      # client-supplied filename verbatim.
      - pattern: (ZipEntry $E).getName()
      - pattern: (java.util.zip.ZipEntry $E).getName()
      - pattern: (ArchiveEntry $E).getName()
      - pattern: (MultipartFile $F).getOriginalFilename()
      - pattern: (org.springframework.web.multipart.MultipartFile $F).getOriginalFilename()
      - pattern: (Part $P).getSubmittedFileName()
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) { ... }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @PathVariable(...) $TYPE $PARAM, ...) { ... }
    pattern-propagators:
      - pattern: (String $A) + (String $B)
        from: $B
        to: $A
      - pattern: (String $A).concat($B)
        from: $B
        to: $A
      - pattern: String.format($FMT, ..., $X, ...)
        from: $X
        to: String.format
      - pattern: $B.append($X)
        from: $X
        to: $B
      - pattern: (StringBuilder $B).toString()
        from: $B
        to: (StringBuilder $B).toString()
      # URL decoding is not sanitisation; it preserves attacker control and is
      # applied to almost every header-sourced value in real servlet code.
      - pattern: URLDecoder.decode($X, ...)
        from: $X
        to: URLDecoder.decode
      - pattern: java.net.URLDecoder.decode($X, ...)
        from: $X
        to: java.net.URLDecoder.decode
      - pattern: new String($X)
        from: $X
        to: new String
      - pattern: new String($X, ...)
        from: $X
        to: new String
      - pattern: (String $S).substring(...)
        from: $S
        to: (String $S).substring(...)
      - pattern: (String $S).trim()
        from: $S
        to: (String $S).trim()
      - pattern: (String $S).toLowerCase(...)
        from: $S
        to: (String $S).toLowerCase(...)
      - pattern: (String $S).replace(...)
        from: $S
        to: (String $S).replace(...)
      - pattern: (String $S).getBytes(...)
        from: $S
        to: (String $S).getBytes(...)
      - pattern: $E.nextElement()
        from: $E
        to: $E.nextElement()
      - pattern: Base64.decodeBase64($X)
        from: $X
        to: Base64.decodeBase64
      - pattern: org.apache.commons.codec.binary.Base64.decodeBase64($X)
        from: $X
        to: org.apache.commons.codec.binary.Base64.decodeBase64
      - pattern: Base64.encodeBase64($X)
        from: $X
        to: Base64.encodeBase64
      - pattern: org.apache.commons.codec.binary.Base64.encodeBase64($X)
        from: $X
        to: org.apache.commons.codec.binary.Base64.encodeBase64
      - pattern: Paths.get(..., $X, ...)
        from: $X
        to: Paths.get
      - pattern: java.nio.file.Paths.get(..., $X, ...)
        from: $X
        to: java.nio.file.Paths.get
      - pattern: $P.resolve($X)
        from: $X
        to: $P.resolve($X)
      - pattern: new File($X)
        from: $X
        to: new File
      - pattern: new File($DIR, $X)
        from: $X
        to: new File
      - pattern: new java.io.File($X)
        from: $X
        to: new java.io.File
      - pattern: new java.io.File($DIR, $X)
        from: $X
        to: new java.io.File
    pattern-sinks:
      # Both the imported and fully qualified spellings. Servlet code and
      # generated code routinely write java.io.* in full, and the previous
      # short-name-only sinks missed every one of those call sites.
      - pattern: new File(...)
      - pattern: new java.io.File(...)
      - pattern: new FileInputStream(...)
      - pattern: new java.io.FileInputStream(...)
      - pattern: new FileOutputStream(...)
      - pattern: new java.io.FileOutputStream(...)
      - pattern: new FileReader(...)
      - pattern: new java.io.FileReader(...)
      - pattern: new FileWriter(...)
      - pattern: new java.io.FileWriter(...)
      - pattern: new RandomAccessFile(...)
      - pattern: new java.io.RandomAccessFile(...)
      - pattern: Files.newInputStream(...)
      - pattern: Files.newOutputStream(...)
      - pattern: Files.newBufferedReader(...)
      - pattern: Files.newBufferedWriter(...)
      - pattern: Files.readAllBytes(...)
      - pattern: Files.readAllLines(...)
      - pattern: Files.write(...)
      - pattern: Files.copy(...)
      - pattern: Files.move(...)
      - pattern: Files.delete(...)
      - pattern: Files.deleteIfExists(...)
      - pattern: java.nio.file.Files.readAllBytes(...)
      - pattern: java.nio.file.Files.write(...)
      - pattern: java.nio.file.Files.copy(...)
      - pattern: java.nio.file.Files.newInputStream(...)
      - pattern: java.nio.file.Files.newOutputStream(...)
      - pattern: Paths.get(...)
      - pattern: java.nio.file.Paths.get(...)
    pattern-sanitizers:
      # normalize() alone collapses ../ but does not confine the result, so it
      # is only a sanitiser when paired with a containment check. The
      # containment check is what actually makes the path safe.
      - patterns:
          - pattern: $PATH.startsWith($BASE)
          - focus-metavariable: $PATH
      - pattern: FilenameUtils.getName(...)
      - pattern: org.apache.commons.io.FilenameUtils.getName(...)
      - pattern: Integer.parseInt(...)
      - pattern: UUID.fromString(...)
    metadata:
      category: security
      cwe: CWE-22
      confidence: high
      subcategory: access-control
      vulnerability_class: "Access Control Violation"
      owasp: "A01:2021"
      fix: "Resolve the path with Path.normalize() and then assert the result startsWith() the intended base directory, or strip the value to a bare filename with FilenameUtils.getName()."

  # SSL/TLS bypass
  - id: java-ssl-bypass
    message: "TLS/SSL certificate validation is disabled or bypassed. This allows man-in-the-middle attacks where attackers can intercept encrypted communications. Always validate certificates in production."
    severity: HIGH
    languages: [java]
    pattern-either:
      - pattern: |
          HttpsURLConnection.setDefaultHostnameVerifier(new HostnameVerifier() {
            public boolean verify(String hostname, SSLSession session) {
              return true;
            }
          });
      - pattern: |
          TrustManager[] trustAllCerts = new TrustManager[] {
            new X509TrustManager() {
              public void checkClientTrusted(...) {}
              public void checkServerTrusted(...) {}
              public X509Certificate[] getAcceptedIssuers() { return null; }
            }
          };
    metadata:
      category: security
      cwe: CWE-295
      confidence: high
      subcategory: crypto
      vulnerability_class: "Cryptographic Weakness"
      owasp: "A07:2021"
      fix: "Never override TrustManager to accept all certificates. Use the default SSLContext or configure with trusted CA certificates only."

  # === Medium Severity Rules ===

  # Weak cipher algorithms
  - id: java-weak-cipher
    message: "Weak or unauthenticated cipher detected. DES, 3DES, RC2, RC4 and Blowfish are broken or deprecated, and ECB mode leaks plaintext structure. Use AES-256 in GCM mode (AES/GCM/NoPadding)."
    severity: MEDIUM
    languages: [java]
    patterns:
      - pattern-either:
          # Cipher.getInstance takes a transformation string such as
          # "DES/CBC/PKCS5Padding", not a bare algorithm name, and is commonly
          # written fully qualified with an optional provider argument.
          - pattern: Cipher.getInstance("$TRANSFORM", ...)
          - pattern: javax.crypto.Cipher.getInstance("$TRANSFORM", ...)
          - pattern: new SecretKeySpec($KEY, "$TRANSFORM")
          - pattern: new javax.crypto.spec.SecretKeySpec($KEY, "$TRANSFORM")
          - pattern: KeyGenerator.getInstance("$TRANSFORM", ...)
      - metavariable-regex:
          metavariable: $TRANSFORM
          regex: (?i)^(des|desede|tripledes|3des|rc2|rc4|arcfour|blowfish)([/].*)?$|^.*/ecb/.*$
    metadata:
      category: security
      cwe: CWE-327
      confidence: high
      subcategory: crypto
      vulnerability_class: "Cryptographic Weakness"
      owasp: "A02:2021"
      fix: "Use Cipher.getInstance('AES/GCM/NoPadding') with a 256-bit key and a unique 12-byte IV per message."

